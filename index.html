<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love and Let Live</title>
<meta name="description" content="No one knows the truth, and no one will. That is not an argument against believing something — only against being so certain you lose people over it. Love, and let live.">
<link rel="canonical" href="https://loveandletlive.com/">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<!-- og:image MUST be absolute — link previews break silently on a relative path -->
<meta property="og:title" content="Love and Let Live">
<meta property="og:description" content="Who's missing from your table?">
<meta property="og:image" content="https://loveandletlive.com/assets/social-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A glowing orb above a dark landscape webbed with golden threads.">
<meta property="og:url" content="https://loveandletlive.com/">
<meta property="og:site_name" content="Love and Let Live">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Love and Let Live">
<meta name="twitter:description" content="Who's missing from your table?">
<meta name="twitter:image" content="https://loveandletlive.com/assets/social-card.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04070f;
    --gold:#f0b94d;
    --gold-soft:#ffd88a;
    --text:#eef0f5;
    --dim:#8b98b6;
    --line:rgba(240,185,77,0.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif;font-weight:300;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:900px;margin:0 auto;padding:0 28px;}

  /* ---------- THE DOOR ----------
     One question at a time. No nav, no logo at the top, nothing to click
     above the fold. Someone who typed this URL off a sticker gets a question
     and silence, which is the whole point. */
  .door{
    position:relative;min-height:calc(100vh - 92px);min-height:calc(100dvh - 92px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:56px 28px 0;
    background-image:
      radial-gradient(ellipse at 50% 42%, rgba(240,185,77,0.13) 0%, rgba(4,7,15,0) 58%),
      linear-gradient(180deg, rgba(4,7,15,0.55) 0%, rgba(4,7,15,0.80) 70%, var(--bg) 100%),
      url('assets/golden-orb.jpg');
    background-size:cover;background-position:center 35%;
  }

  /* The questions stack in the same spot and cross-fade. Min-height stops the
     page jumping as lines of different length swap in. */
  .asks{
    position:relative;width:100%;max-width:760px;
    min-height:4.6em;display:flex;align-items:center;justify-content:center;
  }
  .ask{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;font-weight:400;
    font-size:clamp(30px,5.4vw,58px);line-height:1.22;
    letter-spacing:0.005em;color:var(--text);
    opacity:0;transition:opacity 1.5s ease;
  }
  /* The text MUST live in a single child. A flex container blockifies every
     element child into its own flex item, so a bare "...text <em>text</em>"
     became two items and laid out as two columns with a gap between them —
     invisible on a wide screen, broken on a phone. One span, one item. */
  .ask .q{
    display:block;max-width:100%;
    text-wrap:balance;text-wrap:pretty;
  }
  .ask.on{opacity:1;}
  .ask em{font-style:italic;color:var(--gold-soft);}

  /* The name is the answer to whatever question is showing. It never moves. */
  .mark{
    margin-top:72px;
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(15px,2vw,19px);
    letter-spacing:0.34em;text-transform:uppercase;
    color:rgba(240,185,77,0.82);
  }
  .mark span{color:var(--gold);}

  .cue{
    position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:0.26em;text-transform:uppercase;
    color:rgba(139,152,182,0.42);
  }

  /* The only navigation on the page. Deliberately small and low-contrast —
     it should be findable, not offered. */
  .doors{
    display:flex;align-items:center;justify-content:center;gap:14px;
    padding:0 28px 54px;flex-wrap:wrap;
    font-size:11px;letter-spacing:0.2em;text-transform:uppercase;
  }
  .doors a{color:rgba(139,152,182,0.58);transition:color .25s ease;}
  .doors a:hover{color:var(--gold-soft);}
  .dot{color:rgba(139,152,182,0.25);}

  /* Someone who's turned motion off gets the first question, held still. */
  @media (prefers-reduced-motion:reduce){
    .ask{transition:none;}
  }
</style>
</head>
<body>

<header class="door">
  <div class="asks" id="asks" aria-live="off">
    <!-- questions injected -->
  </div>
  <div class="mark">Love <span>&amp;</span> Let Live</div>
</header>

<!-- Two small doors, and nothing else. The page asks a question and gets
     out of the way; anyone who wants more has to want it. No explanation
     here on purpose — that lives on about.html. -->
<nav class="doors">
  <a href="map.html">The Map</a>
  <span class="dot">·</span>
  <a href="ask.html">The Line</a>
  <span class="dot">·</span>
  <a href="about.html">What This Is</a>
</nav>

<script>
  /* ------------------------------------------------------------------
     THE QUESTIONS

     Rules for anything added here, learned the hard way:
       - Ask about a PERSON, not a concept. "What are you holding on to"
         is an idea and lands soft; "who's missing from your table" is a
         chair, and lands.
       - Never tell the reader they were wrong. The question points at an
         absence they already feel; it does not assign blame for it.
       - No statement of belief. The credo asserted as fact on the front
         page is a truth-claim the credo itself forbids — it lives on the
         About page, framed as where Blair stands, not here.
       - The LAST one opens a door. The sequence earns its name by ending
         somewhere hopeful rather than on the wound.
     ------------------------------------------------------------------ */
  const QUESTIONS = [
    "Who's missing from your table?",
    "Whose name do you not say anymore?",
    "Who stopped telling you things?",
    "Who did you used to call first?",
    "Who do you talk about but not to?",
    "Whose number is still in your phone?",
    "Who would come back, <em>if you asked?</em>"
  ];

  const HOLD = 5200;   // ms a question stays at full opacity
  const FADE = 1500;   // ms cross-fade, matches the CSS transition

  (function(){
    var box = document.getElementById('asks');
    var nodes = QUESTIONS.map(function(q){
      var d = document.createElement('div');
      d.className = 'ask';
      d.innerHTML = '<span class="q">' + q + '</span>';
      box.appendChild(d);
      return d;
    });

    nodes[0].classList.add('on');

    // Motion off: leave the first question up and stop. Don't cycle text at
    // someone who asked the browser to hold still.
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var i = 0;
    setInterval(function(){
      nodes[i].classList.remove('on');
      i = (i + 1) % nodes.length;
      // wait out the fade so the two never overlap at full strength
      setTimeout(function(){ nodes[i].classList.add('on'); }, FADE * 0.55);
    }, HOLD + FADE);
  })();
</script>
</body>
</html>
